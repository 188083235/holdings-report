      <summary onClick={e=>{e.preventDefault();onToggle(f);}} className="cursor-pointer text-[13px] text-blue-600 select-none">📋 详细分析报告</summary>
      {open && <div className="mt-3 space-y-4">
        {(f.shares||[]).length>1 && <div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="text-slate-400 border-b"><th className="text-left py-1">份额</th><th>账户</th><th className="text-right">市值</th><th className="text-right">收益</th></tr></thead>
          <tbody>{(f.shares||[]).map((sh,i)=><tr key={i} className="border-b border-slate-50"><td>{esc(sh.name)} ({esc(sh.code)})</td><td>{esc(sh.account)}</td><td className="text-right num">¥{money(sh.money)}</td><td className="text-right num">{money(sh.hold_earn)}</td></tr>)}</tbody></table></div>}
        {rv.stocks&&rv.stocks.length>0 && <div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="text-slate-400 border-b"><th className="text-left py-1">持仓反推(官方前十大 · 合计{rv.confirmed_sum}%{rv.stock_pct?` · 仓位${rv.stock_pct}%`:""})</th><th>权重</th><th>变动</th><th>行业</th><th>历史季</th><th>证据</th></tr></thead>
          <tbody>{(rv.stocks||[]).map((st,i)=><tr key={i} className="border-b border-slate-50"><td>{esc(st.name)} ({esc(st.code)})</td><td className="num">{st.weight}%</td><td>{esc(st.change)}</td><td>{esc(st.sector||"-")}</td><td className="num">{st.hist_quarters}</td><td className="text-emerald-600">官方</td></tr>)}</tbody></table></div>}
        {(rv.next_ten||[]).length>0 && <div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="text-slate-400 border-b"><th className="text-left py-1">推测持仓11-20名(历史延续)</th><th>历史均重</th><th>持有季</th><th>可信度</th><th>证据</th></tr></thead>
          <tbody>{(rv.next_ten||[]).map((st,i)=><tr key={i} className="border-b border-slate-50"><td>{esc(st.name)} ({esc(st.code)})</td><td className="num">{st.avg_weight}%</td><td className="num">{st.hist_quarters}季</td><td>{esc(st.confidence)}</td><td className="text-amber-500">推断</td></tr>)}</tbody></table></div>}
        {Object.keys(rg).length>0 && <div className="text-xs"><b className="text-slate-600">地区配置(季报PDF·官方):</b> {Object.entries(rg).map(([k,v])=>`${esc(k)} ${v}%`).join("、")}</div>}
        {etfH.length>0 && <div className="text-xs"><b className="text-slate-600">基金投资/ETF(季报·官方):</b> {etfH.map(e=>`${esc(e.name)} ${e.weight}%`).join("、")}</div>}
        {Object.keys(hl.events||{}).length>0 && <div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="text-slate-400 border-b"><th className="text-left py-1">休市差异推断(L5辅助)</th><th>样本</th><th>一致率</th><th>相关</th><th>调整</th><th>置信</th></tr></thead>
          <tbody>{Object.entries(hl.events||{}).map(([k,e],i)=><tr key={i} className="border-b border-slate-50"><td>{esc(k)}</td><td className="num">{e.n??"-"}</td><td className="num">{e.match==null?"-":e.match}</td><td className="num">{e.corr==null?"-":e.corr}</td><td>{esc(e.adjust)}</td><td className="num">{(e.confidence||0)}%</td></tr>)}</tbody></table></div>}
        {zx.dims&&zx.dims.length>0 && <div><div className="text-xs font-bold text-slate-700 mb-1">郑希六维评分</div>
          {zx.dims.map((d,i)=><div key={i} className="flex items-center gap-2 text-xs py-[2px]">
            <span className="w-32 text-slate-600 truncate">{esc(d.name)}<span className="text-slate-300">({d.max}分)</span></span>
            <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">{d.available&&<div className="h-full bg-violet-500 rounded-full" style={{width:(d.score/d.max*100)+"%"}}/>}</div>
            <span className="num w-7 text-right font-semibold text-violet-600 shrink-0">{d.available?d.score:"--"}</span>
          </div>)}
          <div className="text-[11px] text-slate-400 mt-1">{esc(zx.summary||"")}</div></div>}
        {infEntries.length>0 && <div><div className="text-xs font-bold text-slate-700 mb-1">推断暴露(净值回归 · R²={inf.r2==null?"-":inf.r2} · <span style={{color:hic>=60?"#10b981":hic>=40?"#d97706":"#dc2626"}}>{esc(inf.decision||"")} {hic}/100</span>)</div>
          <div className="space-y-1">{[...infEntries].sort((a,b)=>b[1]-a[1]).map(([k,v])=><div key={k} className="flex items-center gap-2 text-xs"><span className="w-24 truncate text-slate-600">{esc(k)}</span>
            <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-cyan-500 rounded-full" style={{width:(v*100)+"%"}}/></div>
            <span className="num w-10 text-right text-slate-700">{(v*100).toFixed(0)}%</span></div>)}</div></div>}
        {mods.length>0 && <div><div className="text-xs font-bold text-slate-700 mb-1">模块评分(权重占比)</div>
          {mods.map((m,i)=><ModuleBar key={i} m={m}/>)}</div>}
        {(ol.text||dr.text||at.text||bm.score!=null) && <div className="text-[11px] text-slate-500 space-y-1">
          {bm.score!=null && <div><b>基准匹配度</b> {esc(bm.score)}/100 · {esc(bm.mode||"")}</div>}
          {ol.text && <div><b>前瞻展望(预测,置信 {Math.round(ol.confidence||0)}%)</b> {esc(ol.text)}</div>}
          {dr.text&&dr.basis && <div><b>风格漂移({dr.detected===true?`·${esc(dr.level||"疑似漂移")}`:""}{dr.detected===false?"·稳定":""})</b> {esc(dr.text||dr.basis)}</div>}
          {at.text && <div><b>能力归因(置信 {Math.round(at.confidence||0)}%)</b> {esc(at.text)}</div>}
        </div>}
        {f.forensics&&f.forensics.timeline&&f.forensics.timeline.length>0 && (()=>{
          const fx = f.forensics;
          const tl = fx.timeline;
          const cur = fx.current||{};
          const base = cur.base||[];
          const tlRows = tl.map((t,i)=>"<tr><td>"+esc(t.quarter)+"</td><td class='num'>"+(t.scale==null?"-":t.scale.toFixed(2)+"亿")+"</td><td>"+
            (t.stocks||[]).slice(0,5).map(s=>esc(s.name)+" "+s.weight+"%").join("、")+"</td></tr>").join("");
          const pvRows = (fx.passive_vs_active&&fx.passive_vs_active.periods||[]).slice(-3).flatMap(p=>
            (p.actions||[]).map(a=>"<tr><td>"+esc(p.from)+"→"+esc(p.to)+"</td><td>"+esc(a.name)+"</td><td class='num'>"+
              (a.prev_w==null?"-":a.prev_w+"%")+"</td><td class='num'>"+(a.curr_w==null?"-":a.curr_w+"%")+"</td><td class='num'>"+
              (a.theoretical_w==null?"-":a.theoretical_w+"%")+"</td><td class='num'>"+(a.ret==null?"-":a.ret+"%")+"</td><td>"+
              "<b style='color:"+(a.action.includes("增持")?"#e11d48":a.action.includes("减持")?"#0d9488":"#64748b")+"'>"+esc(a.action)+"</b>"+
              "("+esc(a.level)+")"+(a.reason?"<span class='text-slate-400'> "+esc(a.reason)+"</span>":"")+"</td></tr>")).join("");
          const nbRows = (fx.nav_bridge&&fx.nav_bridge.periods||[]).slice(-4).map(p=>
            "<tr><td>"+esc(p.from)+"→"+esc(p.to)+"</td><td class='num'>"+(p.actual_ret==null?"-":p.actual_ret+"%")+"</td>"+
            "<td class='num'>"+(p.passive_ret==null?"-":p.passive_ret+"%")+"</td><td class='num'>"+(p.covered_pct==null?"-":p.covered_pct+"%")+"</td>"+
            "<td class='num'>"+(p.active_residual==null?"-":p.active_residual+"%")+"</td></tr>").join("");
          const curRows = base.map(r=>"<tr><td>"+esc(r.name)+"</td><td class='num'>"+r.weight+"%</td><td class='num'>"+
            r.lo+"–"+r.hi+"%</td><td class='num'>"+r.prob+"%</td><td class='num'>"+r.confidence+"%</td><td>"+esc(r.basis)+"</td></tr>").join("");
          const perTop = (fx.persistence||[]).slice(0,6).map(p=>"<tr><td>"+esc(p.name)+"</td><td class='num'>"+
            p.quarters+"季</td><td class='num'>"+p.max_w+"%</td><td class='num'>"+p.last_w+"%</td><td class='num'>"+
            p.hold_prob+"%</td>"+(p.last_drop?"<td class='text-amber-600'>减持信号</td>":"<td>-</td>")+"</tr>").join("");
          const gapLine = (fx.gaps||[]).map(g=>"<div>· "+esc(g)+"</div>").join("");
          return <div className="space-y-3">
            <div className="text-xs font-bold text-slate-700">持仓反推证据链(2024至当前 · {fx.n_quarters}个报告期 · {esc(fx.evidence_level||"")})</div>
            <div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="text-slate-400 border-b"><th className="text-left py-1">报告期</th><th>规模</th><th>前五重仓</th></tr></thead>
              <tbody dangerouslySetInnerHTML={{__html:tlRows}}/></table></div>
            {pvRows && <div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="text-slate-400 border-b">
              <th className="text-left py-1">被动vs主动(期→期)</th><th>股票</th><th>上期权重</th><th>披露权重</th><th>理论权重</th><th>期间涨跌</th><th>判断</th></tr></thead>
              <tbody dangerouslySetInnerHTML={{__html:pvRows}}/></table></div>}
            {nbRows && <div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="text-slate-400 border-b">
              <th className="text-left py-1">净值反推(实际 vs 被动)</th><th>实际收益</th><th>理论被动</th><th>覆盖</th><th>主动残留</th></tr></thead>
              <tbody dangerouslySetInnerHTML={{__html:nbRows}}/></table></div>}
            {perTop && <div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="text-slate-400 border-b">
              <th className="text-left py-1">持续性评分(前6)</th><th>季度数</th><th>最高权重</th><th>最近权重</th><th>持有概率</th><th>信号</th></tr></thead>
              <tbody dangerouslySetInnerHTML={{__html:perTop}}/></table></div>}
            <div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="text-slate-400 border-b">
              <th className="text-left py-1">当前持仓推测(基准版 · 权重合计{cur.base_total==null?"-":cur.base_total+"%"})</th>
              <th>权重</th><th>区间</th><th>持有概率</th><th>置信度</th><th>依据</th></tr></thead>
              <tbody dangerouslySetInnerHTML={{__html:curRows}}/></table></div>
            <div className="text-[11px] text-slate-400">数据缺口与误差来源:{gapLine}</div>
          </div>;
        })()}
      </div>}
    </details>
  </div>;
}

function App() {
  const [openIdx,setOpenIdx] = React.useState(-1);
  const [sort,setSort] = React.useState("total");
  const [filter,setFilter] = React.useState("all");
  const s = DATA.summary;
  let funds = [...DATA.funds];
  if(filter==="miss") funds = funds.filter(x=>x.missing&&x.missing.length);
  if(sort==="total") funds.sort((a,b)=>(b.total_score??-1)-(a.total_score??-1));
  else if(sort==="money") funds.sort((a,b)=>b.total-a.total);
  else funds.sort((a,b)=>a.hold_earn-b.hold_earn);
  return <div className="min-h-screen">
    <header className="bg-slate-900 text-white">
      <div className="max-w-7xl mx-auto px-4 md:px-6 py-6">
        <div className="flex items-baseline justify-between flex-wrap gap-2">
          <h1 className="text-xl font-bold tracking-tight">养基宝持仓分析 <span className="text-slate-400 font-normal text-sm">Dashboard</span></h1>
          <div className="text-xs text-slate-400">生成时间 {DATA.generated_at} · 基金 {s.fund_count} 只{s.share_count>s.fund_count?`(含A/C份额${s.share_count}支)`:""}</div>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
          <Metric label="总市值" value={"¥"+money(s.total_money)} accent="#60a5fa"/>
          <Metric label="总收益" value={"¥"+money(s.total_earn)} accent={s.total_earn>=0?"#f87171":"#34d399"}/>
          <Metric label="基金数" value={s.fund_count} sub={s.share_count+" 个份额"}/>
          <Metric label="数据质量 L1" value={esc((s.data_quality||{}).overall||"-")} sub={"推断:"+esc((s.data_quality||{}).holding_inference||"-")}/>
        </div>
      </div>
    </header>
    <main className="max-w-7xl mx-auto px-4 md:px-6 py-6 space-y-6">
      <section><div className="text-sm font-bold text-slate-700 mb-3">市场快照</div><IndexGrid/></section>
      <section><TopStocks/></section>
      <section>
        <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
          <div className="text-sm font-bold text-slate-700">基金评分</div>
          <div className="flex gap-2 text-xs">
            <select value={sort} onChange={e=>setSort(e.target.value)} className="bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-slate-600 outline-none focus:border-blue-400">
              <option value="total">总分(降序)</option><option value="money">市值(降序)</option><option value="earn">收益(升序)</option>
            </select>
            <select value={filter} onChange={e=>setFilter(e.target.value)} className="bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-slate-600 outline-none focus:border-blue-400">
              <option value="all">全部</option><option value="miss">仅数据不足</option>
            </select>
          </div>
        </div>
        <div className="space-y-4">
          {funds.map((f,i)=><FundCard key={i} f={f} open={openIdx===i} onToggle={f=>setOpenIdx(openIdx===i?-1:i)}/>)}
        </div>
      </section>
    </main>
    <footer className="max-w-7xl mx-auto px-4 md:px-6 pb-8 text-center text-[11px] text-slate-400">
      数据来源:养基宝/天天基金/东财/腾讯行情/AkShare/FRED/Yahoo 公开接口 · 评分基于公开数据近似计算,不构成投资建议
    </footer>
  </div>;
}
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
