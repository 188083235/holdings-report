          {ml.items.map((b,i)=><div key={i} className="rounded-md bg-white/70 border border-slate-100 px-2.5 py-2">

              <span className="w-[80px] shrink-0 font-bold text-[11px]" style={{color:rc(b.rating)}}>{esc(b.rating)}</span>
              <span className="flex-1 min-w-0 font-semibold text-slate-800">{esc(b.name)}</span>
              <span className="num text-[15px] font-bold text-slate-800 shrink-0">{b.score}</span>
              <span className="num shrink-0 text-[10px] text-slate-400">涨跌 {b.chg!=null?(b.chg>=0?"+":"")+b.chg+"%":"-"}</span>
              <span className="num shrink-0 text-[10px] text-slate-400">{b.net_in!=null?(b.net_in>=0?"+":"")+b.net_in+"亿":"-"}</span>
              <span className="shrink-0 text-[10px] text-slate-400 truncate max-w-[110px]" title={esc(b.leader)}>领涨:{esc(b.leader)} {b.leader_chg!=null?"+"+b.leader_chg+"%":""}</span>
            </div>
            <div className="grid grid-cols-5 gap-1.5 mt-1.5">
              {dimsCfg.map(([k,c],di)=>{
                const v = k==="受限项"?sub(b.dims):Math.round((b.dims||{})[k]||0);
                const mx = k==="受限项"?11:20;
                return <div key={di} className="text-[9px] text-slate-400">
                  <div className="flex justify-between"><span>{esc(k)}</span><span className="num font-semibold text-slate-600">{v}</span></div>
                  <div className="h-1 bg-slate-100 rounded-full mt-0.5 overflow-hidden"><div className="h-full rounded-full" style={{width:Math.min(100,v/mx*100)+"%",background:c}}/></div>
                </div>;
              })}
            </div>
            {(b.funds||[]).length>0 && <div className="mt-1 text-[10px] text-slate-500 truncate" title={(b.funds||[]).map(f=>esc(f.name)+" 主线仓位"+f.ratio+"% ("+(f.matched||[]).join("、")+")").join("、")}>
              🎯 主线相关:{ (b.funds||[]).map((f,fi)=><span key={fi} className="mr-2">{esc(f.name)} <span className="num font-semibold text-amber-600">{f.ratio}%</span></span>) }
            </div>}
          </div>)}
        </div>
      </div>;
    })()}
    {(()=>{
      const ex = DATA.summary.exposure;
      if (!ex || !ex.sector || !ex.sector.length) return null;
      const mxS = Math.max(...ex.sector.map(x=>x.pct), 1);
      const mxK = Math.max(...ex.stock.map(x=>x.pct), 1);
      return <div className="mb-4 rounded-lg border border-indigo-100 bg-indigo-50/40 p-3">
        <div className="text-xs font-bold text-slate-700 mb-1">📊 组合真实风险暴露(穿透基金层)<span className="text-[10px] font-normal text-slate-400"> · 12只基金可能只有N个核心风险因子</span></div>
        <div className="text-[10px] text-slate-500 mb-2">{esc(ex.note||"")}</div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <div className="text-[10px] text-slate-400 mb-1">行业暴露(组合占比)</div>
            {ex.sector.slice(0,8).map((s,i)=><div key={i} className="flex items-center gap-2 text-[11px] py-[2px]">
              <span className="w-28 truncate text-slate-600 shrink-0" title={esc(s.name)}>{esc(s.name)}</span>
              <div className="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full rounded-full" style={{width:Math.max(2,s.pct/mxS*100)+"%",background:"#6366f1"}}/></div>
              <span className="num w-10 text-right text-slate-600 shrink-0">{s.pct}%</span>
            </div>)}
          </div>
          <div>
            <div className="text-[10px] text-slate-400 mb-1">重仓股暴露(多基金同持累加)</div>
            {ex.stock.slice(0,9).map((s,i)=><div key={i} className="flex items-center gap-2 text-[11px] py-[2px]">
              <span className="w-28 truncate text-slate-600 shrink-0" title={esc(s.name)}>{esc(s.name)}</span>
              <div className="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full rounded-full" style={{width:Math.max(2,s.pct/mxK*100)+"%",background:"#0ea5e9"}}/></div>
              <span className="num w-10 text-right text-slate-600 shrink-0">{s.pct}%</span>
            </div>)}
          </div>
        </div>
      </div>;
    })()}
    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
      <div className="bg-slate-50 rounded-lg p-3"><div className="text-[10px] text-slate-400">💰 组合今日估算涨跌(持仓加权)</div>
        <div className="text-2xl font-bold num" style={{color:estColor(risk.est_today)}}>{risk.est_today==null?"-":(risk.est_today>=0?"+":"")+risk.est_today+"%"}</div>
        <div className="text-[10px] text-slate-400 mt-1">估算覆盖 {risk.est_coverage??0}% 仓位 · 仅供参考</div></div>
      <div className="bg-slate-50 rounded-lg p-3"><div className="text-[10px] text-slate-400">📉 当日最差基金(估算)</div>
        <div className="text-lg font-bold text-slate-800 truncate">{esc(risk.worst_name||"-")}</div>
        <div className="text-xs num" style={{color:estColor(risk.worst_est)}}>{risk.worst_est==null?"-":risk.worst_est+"%"}</div></div>
      <div className="bg-slate-50 rounded-lg p-3"><div className="text-[10px] text-slate-400">🎯 AI 操作分布</div>
        <div className="text-lg font-bold text-slate-800"><span className="text-red-600">清仓{items.filter(x=>x.tier==="red").length}</span> · <span className="text-orange-600">减仓{items.filter(x=>x.tier==="orange").length}</span> · <span className="text-teal-600">止盈/补{items.filter(x=>x.tier==="teal").length}</span> · <span className="text-emerald-600">加仓{items.filter(x=>x.tier==="green").length}</span> · <span className="text-slate-500">持有{items.filter(x=>x.tier==="yellow").length}</span></div></div>
    </div>
    {rb.length>0 && <div className="mb-4"><div className="text-xs font-bold text-slate-700 mb-1">再平衡提醒(组合层面)</div>
      {rb.map((r,i)=><div key={i} className="flex items-center justify-between gap-2 text-xs py-[3px] border-b border-slate-50">
        <span className="truncate">{esc(r.name)} <span className="text-slate-400">({r.weight}%)</span></span>
        <span className="shrink-0"><b className="text-amber-600">{esc(r.action)}</b> <span className="text-slate-500">{esc(r.hint)}</span></span></div>)}
    </div>}
    <div><div className="text-xs font-bold text-slate-700 mb-1">每基金操作(质量/机会分离 · 操作值=0.4×质量+0.6×机会 · 置信度)</div>
      <div className="overflow-x-auto"><table className="w-full text-xs tbl" style={{minWidth:620}}><colgroup><col style={{width:80}}/><col style={{width:160}}/><col style={{width:70}}/><col/></colgroup><thead><tr className="text-slate-400 border-b"><th className="text-left py-1" style={{width:80}}>操作</th><th className="text-left">基金</th><th className="text-right">操作值</th><th className="text-left">建议与理由</th></tr></thead>
        <tbody>{items.map((it,i)=><tr key={i} className="border-b border-slate-50 hover:bg-slate-50/60">
          <td><span className={"px-1.5 py-0.5 rounded text-[10px] font-semibold whitespace-nowrap inline-block "+badge(it.tier)}>{esc(it.action)}</span></td>
          <td className="font-semibold text-slate-700" style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={esc(it.name)}>{esc(it.name)}</td>
          <td className="num whitespace-nowrap text-right" title={`质量${it.quality==null?"-":it.quality}/机会${it.opportunity==null?"-":it.opportunity} · 置信${it.confidence==null?"-":it.confidence}%`}>
            <b>{it.action_value==null?"-":it.action_value}</b></td>
          <td><div>{esc(it.reason)}
            <span className="text-slate-400">（占比 {it.weight}% · 浮盈亏 {it.pnl>0?"+":""}{it.pnl}%）</span></div>
            {it.amount && <div className="text-[10px] text-slate-400 mt-0.5">💡 {esc(it.amount)}</div>}
            {it.failure && <div className="text-[10px] text-rose-400 mt-0.5">⚠️ {esc(it.failure)}</div>}
            {it.reallocate && <div className="text-[10px] text-blue-500 mt-0.5">↪️ {esc(it.reallocate)}</div>}
          </td>
        </tr>)}</tbody></table></div></div>
  </div>;
}

function AuditBlocks() {
  const ta = DATA.summary.time_audit||{};
  const sc = DATA.summary.signal_check||{};
  if(!ta.available && !sc.available) return null;
  return <section className="space-y-3">
    {ta.available && <details className="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
      <summary className="cursor-pointer text-sm font-bold text-slate-700 select-none">🕐 数据时间审计<span className="text-[10px] font-normal text-slate-400 ml-1">{ta.risk||""}</span></summary>
      <div className="overflow-x-auto pt-3"><table className="w-full text-xs tbl"><thead><tr className="text-slate-400 border-b"><th className="text-left py-1">数据项</th><th className="text-right">事件时间</th><th className="text-right">数据可用</th><th className="text-right">信号计算</th><th className="text-right">状态</th></tr></thead>
        <tbody>{(ta.rows||[]).map((r,i)=><tr key={i} className="border-b border-slate-50">
          <td>{esc(r.item)}</td><td className="num text-right">{esc(r.event_time||"-")}</td><td className="num text-right">{esc(r.available||"-")}</td>
          <td className="num text-right">{esc(r.signal||"-")}</td>
          <td className="text-right" style={{color:(r.status||"").includes("风险")?"#dc2626":"#059669"}}>{esc(r.status)}</td></tr>)}
        </tbody></table></div>
    </details>}
    {sc.available && <details className="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
      <summary className="cursor-pointer text-sm font-bold text-slate-700 select-none">📊 信号校验(历史建议 IC/准确率)</summary>
      <div className="pt-3 text-xs space-y-1">
        <div>方向准确率:5日 <b>{sc.acc_5d==null?"-":sc.acc_5d}</b> · 10日 <b>{sc.acc_10d==null?"-":sc.acc_10d}</b> · 30日 <b>{sc.acc_30d==null?"-":sc.acc_30d}</b></div>
        <div>IC(质量分 vs 后续30日收益): <b>{sc.ic==null?"-":sc.ic}</b> · top3 基金集中度: <b>{sc.concentration==null?"-":sc.concentration}</b> · 样本 <b>{sc.n}</b> 条</div>
        <div className="text-[10px] text-slate-400">{esc(sc.basis||"")}</div>
      </div>
    </details>}
  </section>;
}

function Recommend() {
  const rc = DATA.summary.recommend||{};
  const groups = [["基金(综合分+操作值+4433)", rc.funds], ["行业(景气动量)", rc.sectors],
                  ["指数(60日动量)", rc.indices], ["基金经理(风格契合+长期)", rc.managers]];
  const has = groups.some(([,g])=>(g||[]).length>0);
  if(!has) return null;
  return <section className="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
    <div className="text-center text-sm font-bold text-slate-800 pb-3 border-b border-slate-100 mb-3">📌 推荐关注(基于最新评分/景气/动量 · 数据截至 {esc(rc.as_of||"-")})</div>
    <div className="space-y-3">
      {groups.map(([label,items])=>(items||[]).length>0 && <div key={label}>
        <div className="text-xs font-bold text-slate-700 mb-1">{label}</div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
          {items.map((it,i)=><div key={i} className="bg-slate-50 rounded-lg p-2.5 text-xs">
            <div className="font-semibold text-slate-800">{esc(it.name)}
              {it.streak>=2 && <span className="text-amber-500 text-[10px] ml-1">连续{it.streak}次</span>}
            </div>
            <div className="text-[10px] text-slate-400 mt-0.5">{esc(it.reason)}</div>
          </div>)}
        </div>
      </div>)}
    </div>
  </section>;
}

function App() {
  const [openIdx,setOpenIdx] = React.useState(-1);
  const [sort,setSort] = React.useState("total");
  const [filter,setFilter] = React.useState("all");
  const s = DATA.summary;
  let funds = [...DATA.funds];
  if(filter==="miss") funds = funds.filter(x=>x.missing&&x.missing.length);
  if(sort==="total") funds.sort((a,b)=>(b.total_score??-1)-(a.total_score??-1));
  else if(sort==="money") funds.sort((a,b)=>b.total-a.total);
  else funds.sort((a,b)=>a.hold_earn-b.hold_earn);
  return <div className="min-h-screen">
    <header className="bg-slate-900 text-white">
      <div className="max-w-7xl mx-auto px-4 md:px-6 py-6">
        <div className="flex items-baseline justify-between flex-wrap gap-2">
          <h1 className="text-xl font-bold tracking-tight">养基宝持仓分析 <span className="text-slate-400 font-normal text-sm">Dashboard</span></h1>
          <div className="flex items-center gap-3 flex-wrap">
            <a href="https://Zacky-yu.github.io/xiao-long-finance-daily/" target="_blank" rel="noopener noreferrer"
               className="text-xs px-3 py-1.5 rounded-full bg-blue-600/80 hover:bg-blue-500 text-white font-medium"
               title="小龙财经日报:实时A股/半导体/黄金白银/基金博主操作">🐉 小龙财经日报</a>
            <span className="text-xs text-slate-400">生成时间 {DATA.generated_at} · 基金 {s.fund_count} 只{s.share_count>s.fund_count?`(含A/C份额${s.share_count}支)`:""}</span>
          </div>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
          <Metric label="总市值" value={"¥"+money(s.total_money)} accent="#60a5fa"/>
          <Metric label="总收益" value={"¥"+money(s.total_earn)} accent={s.total_earn>=0?"#f87171":"#34d399"}
            sub={(()=>{const ym=s.yjb_market||{}; if(ym.today_income==null) return null;
              const n=Number(ym.today_income); const r=ym.today_income_rate;
              return <span style={{color:n>=0?"#f87171":"#34d399"}}>今日 {n>=0?"+":""}{money(n)}{r!=null?` (${Number(r)>=0?"+":""}${r}%)`:""}</span>;})()}/>
          <Metric label="基金数" value={s.fund_count} sub={s.share_count+" 个份额"}/>
          <Metric label="数据质量 L1" value={esc((s.data_quality||{}).overall||"-")} sub={"推断:"+esc((s.data_quality||{}).holding_inference||"-")}/>
        </div>
      </div>
    </header>
    <main className="max-w-7xl mx-auto px-4 md:px-6 py-6 space-y-6">
      <section><div className="text-sm font-bold text-slate-700 mb-3">市场快照</div><IndexGrid/></section>
      <section><TopStocks/></section>
      <section><HotNews/></section>
      <section><Advice/></section>
      <section><AuditBlocks/></section>
      <section><Recommend/></section>
      <section>
        <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
          <div className="text-sm font-bold text-slate-700">基金评分</div>
          <div className="flex gap-2 text-xs">
            <select value={sort} onChange={e=>setSort(e.target.value)} className="bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-slate-600 outline-none focus:border-blue-400">
              <option value="total">总分(降序)</option><option value="money">市值(降序)</option><option value="earn">收益(升序)</option>
            </select>
            <select value={filter} onChange={e=>setFilter(e.target.value)} className="bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-slate-600 outline-none focus:border-blue-400">
              <option value="all">全部</option><option value="miss">仅数据不足</option>
            </select>
          </div>
        </div>
        <div className="space-y-4">
          {funds.map((f,i)=><FundCard key={i} f={f} open={openIdx===i} onToggle={f=>setOpenIdx(openIdx===i?-1:i)}/>)}
        </div>
      </section>
    </main>
    <footer className="max-w-7xl mx-auto px-4 md:px-6 pb-8 text-center text-[11px] text-slate-400">
      数据来源:养基宝/天天基金/东财/腾讯行情/AkShare/FRED/Yahoo 公开接口 · 评分基于公开数据近似计算,不构成投资建议
    </footer>
  </div>;
}
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
